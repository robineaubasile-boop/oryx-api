<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oryx Invest — Chat Test</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
#header { background: #1a1a2e; color: #fff; padding: 14px 20px; text-align: center; font-size: 16px; font-weight: 600; }
#header span { font-size: 12px; color: #888; display: block; margin-top: 2px; }
#reset-btn { margin-top: 8px; padding: 4px 10px; background: transparent; color: #aaa; border: 1px solid #444; border-radius: 6px; font-size: 11px; font-weight: 400; cursor: pointer; }
#reset-btn:hover { color: #fff; border-color: #888; }
#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: #1a1a2e; color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: #fff; color: #222; border: 1px solid #ddd; border-bottom-left-radius: 4px; }
.msg .route-tag { font-size: 11px; color: #888; margin-top: 6px; display: block; }
.msg.system { align-self: center; background: #e8e8e8; color: #666; font-size: 12px; border-radius: 8px; }
#input-bar { display: flex; padding: 12px; background: #fff; border-top: 1px solid #ddd; gap: 8px; }
#input-bar input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
#input-bar input:focus { border-color: #1a1a2e; }
#input-bar button { padding: 10px 20px; background: #1a1a2e; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
#input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
.typing { align-self: flex-start; color: #888; font-size: 13px; padding: 6px 14px; }
</style>
</head>
<body>

<div id="header">
Oryx Invest — Chat Test
<span>MVP pour testeurs (pas un produit fini)</span>
<button id="reset-btn" onclick="resetConversation()">Nouvelle conversation</button>
</div>

<div id="messages"></div>

<div id="input-bar">
<input type="text" id="input" placeholder="Pose ta question..." autocomplete="off" />
<button id="send" onclick="sendMessage()">Envoyer</button>
</div>

<script>
function getSessionId() {
	let sid = localStorage.getItem('oryx_session_id');
	if (!sid) {
		sid = crypto.randomUUID();
		localStorage.setItem('oryx_session_id', sid);
	}
	return sid;
}

const SESSION_ID = getSessionId();
const messagesDiv = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMessage(text, role, routeUsed) {
	const div = document.createElement('div');
	div.className = 'msg ' + role;
	div.textContent = text;
	if (routeUsed && role === 'assistant') {
		const tag = document.createElement('span');
		tag.className = 'route-tag';
		tag.textContent = '/' + routeUsed;
		div.appendChild(tag);
	}
	messagesDiv.appendChild(div);
	messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function showTyping() {
	const div = document.createElement('div');
	div.className = 'typing';
	div.id = 'typing';
	div.textContent = 'Oryx réfléchit...';
	messagesDiv.appendChild(div);
	messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function hideTyping() {
	const el = document.getElementById('typing');
	if (el) el.remove();
}

async function sendMessage() {
	const text = inputEl.value.trim();
	if (!text) return;

	inputEl.value = '';
	sendBtn.disabled = true;
	addMessage(text, 'user');
	showTyping();

	try {
		const res = await fetch('/web-chat', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ session_id: SESSION_ID, message: text })
		});
		const data = await res.json();
		hideTyping();

		if (data.success) {
			addMessage(data.response, 'assistant', data.route_used);
		} else {
			addMessage('Erreur : ' + (data.error || 'inconnue'), 'system');
		}
	} catch (err) {
		hideTyping();
		addMessage('Erreur réseau : ' + err.message, 'system');
	}

	sendBtn.disabled = false;
	inputEl.focus();
}

function resetConversation() {
	if (!confirm('Effacer l\'historique et démarrer une nouvelle conversation ?')) return;
	localStorage.removeItem('oryx_session_id');
	location.reload();
}

inputEl.addEventListener('keydown', function(e) {
	if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
});

addMessage('Bienvenue sur Oryx Invest. Pose ta question sur une action, un ETF, ou un concept d\'investissement.', 'system');
</script>

</body>
</html>
